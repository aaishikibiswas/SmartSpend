<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartSpend Serverless Frontend</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top right, #1f2d5c, #050b1d 60%);
        color: #eef2ff;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .card {
        width: min(760px, 92vw);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 20px;
        padding: 28px;
        background: rgba(10, 18, 40, 0.75);
        box-shadow: 0 22px 50px rgba(5, 8, 21, 0.45);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 2rem;
      }
      p {
        color: #cbd5e1;
      }
      code {
        display: inline-block;
        margin-top: 8px;
        padding: 6px 10px;
        border-radius: 8px;
        background: rgba(30, 41, 59, 0.7);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>SmartSpend Implementation 2</h1>
      <p>
        This CloudFront + S3 frontend confirms the serverless/container architecture is deployed.
      </p>
      <p>Use API Gateway path: <code>/api/health</code> and <code>/api/session</code>.</p>
    </div>
  </body>
</html>
